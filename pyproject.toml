[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "subpopfig"
version = "0.1.0"
description = "Per-entry LogNormal mixture fits plotted as subpopulations across groups and ordered levels"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "openpyxl>=3.0",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["subpopfig*"]
